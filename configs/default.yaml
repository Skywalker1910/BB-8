model:
  d_model: 128
  num_layers: 4
  num_heads: 4
  d_ff: 512
  max_seq_len: 256
  dropout: 0.1
  activation: gelu
  tie_weights: true

tokenizer:
  type: char        # char | word | bpe
  vocab_size: 5000  # used only for word/bpe; ignored for char

training:
  batch_size: 32
  num_epochs: 10
  lr: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  mixed_precision: true
  log_interval: 10
  eval_interval: 100
  save_interval: 500

data:
  seq_len: 256
  stride: 1
  val_fraction: 0.1

generation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1

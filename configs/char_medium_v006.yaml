# v006 — Scaling study: same Shakespeare data, 7x more parameters
# Goal: measure quality gain from wider embeddings, more layers, longer context
experiment:
  objective: character_language_model_scaling
  status: completed
  baseline: bb8-char-small-v002
  change: d_model 64->128, layers 2->4, context 128->256

model:
  d_model: 128
  num_layers: 4
  num_heads: 4
  d_ff: 512
  max_seq_len: 256
  dropout: 0.1
  activation: gelu
  tie_weights: true

tokenizer:
  type: char
  vocab_size: null

training:
  batch_size: 32
  num_epochs: 15
  lr: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  mixed_precision: true
  log_interval: 20
  eval_interval: 200
  save_interval: 1000

data:
  seq_len: 256
  stride: 128
  val_fraction: 0.1

generation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.1
